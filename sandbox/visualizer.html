<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Neon Wave Visualizer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 10, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const gridSize = 20;
    const bars = [];
    const group = new THREE.Group();
    scene.add(group);

    for (let x = 0; x < gridSize; x++) {
        for (let z = 0; z < gridSize; z++) {
            const geometry = new THREE.BoxGeometry(0.8, 1, 0.8);
            const material = new THREE.MeshBasicMaterial({ color: (x + z) % 2 === 0 ? 0x00ffcc : 0xcc00ff, wireframe: true });
            const bar = new THREE.Mesh(geometry, material);
            bar.position.set(x - gridSize / 2, 0, z - gridSize / 2);
            group.add(bar);
            bars.push({ mesh: bar, x, z });
        }
    }

    function animate(time) {
        requestAnimationFrame(animate);
        const t = time * 0.002;
        bars.forEach(b => {
            const height = Math.sin(b.x * 0.5 + t) * Math.cos(b.z * 0.5 + t) * 2;
            b.mesh.scale.y = 1 + height;
            b.mesh.position.y = height / 2;
        });
        controls.update();
        renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
