<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piston Cylinder Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; }
        canvas { display: block; }
    </style>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const config = { speed: 0.05, wireframe: true, intensity: 2 };
    const gui = new lil.GUI();
    gui.add(config, 'speed', 0, 0.2);
    gui.add(config, 'wireframe').onChange(v => cylinder.material.wireframe = v);
    gui.add(config, 'intensity', 0, 10);

    const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 4, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0xaaaaaa, wireframe: true, transparent: true, opacity: 0.3 }));
    scene.add(cylinder);

    const crank = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.5, 32), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1, roughness: 0.2 }));
    crank.rotation.x = Math.PI / 2;
    scene.add(crank);

    const piston = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 32), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5, roughness: 0.5 }));
    scene.add(piston);

    const light = new THREE.PointLight(0xff4500, 0, 5);
    scene.add(light);

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += config.speed;
        const crankAngle = time;
        const crankRadius = 0.8;
        const rodLength = 2.5;
        
        const x = Math.cos(crankAngle) * crankRadius;
        const y = Math.sin(crankAngle) * crankRadius;
        crank.position.set(x, -2, 0);

        const pistonY = Math.sqrt(rodLength * rodLength - x * x) + y;
        piston.position.set(0, pistonY - 1, 0);

        if (Math.abs(crankAngle % (Math.PI * 2)) < 0.1) {
            light.intensity = config.intensity;
        } else {
            light.intensity *= 0.9;
        }
        light.position.set(0, 1.5, 0);

        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
