<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel Art Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Ensure content is visible even if JS fails */
        .cell { background: #000; }
    </style>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #grid { display: grid; grid-template-columns: repeat(16, 20px); gap: 1px; background: #333; border: 2px solid #555; cursor: crosshair; }
        .cell { width: 20px; height: 20px; background: #000; }
        .controls { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
        .palette { display: flex; gap: 5px; margin-bottom: 10px; }
        .color-swatch { width: 30px; height: 30px; cursor: pointer; border: 2px solid transparent; }
        .active { border-color: #fff; }
    </style>
</head>
<body>
    <h1>Pixel Art Generator</h1>
    <div class="palette" id="palette"></div>
    <div id="grid"></div>
    <div class="controls">
        <button id="clear">Clear</button>
        <label><input type="checkbox" id="mirror"> Mirror Mode</label>
        <button id="eraser">Eraser</button>
    </div>
    <script>
        const grid = document.getElementById('grid');
        const palette = document.getElementById('palette');
        const colors = ['#ff00ff', '#00ffff', '#ffff00', '#00ff00', '#ff0000', '#0000ff', '#ffffff', '#000000'];
        let currentColor = '#ff00ff';
        let isDrawing = false;

        colors.forEach(c => {
            const div = document.createElement('div');
            div.className = 'color-swatch';
            div.style.backgroundColor = c;
            div.onclick = () => { currentColor = c; document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active')); div.classList.add('active'); };
            palette.appendChild(div);
        });

        for (let i = 0; i < 256; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;
            cell.onmousedown = () => { isDrawing = true; paint(cell); };
            cell.onmouseover = () => { if (isDrawing) paint(cell); };
            grid.appendChild(cell);
        }

        function paint(cell) {
            const color = currentColor === 'eraser' ? '#000' : currentColor;
            cell.style.backgroundColor = color;
            if (document.getElementById('mirror').checked) {
                const idx = parseInt(cell.dataset.index);
                const row = Math.floor(idx / 16);
                const col = idx % 16;
                const mirrorIdx = row * 16 + (15 - col);
                grid.children[mirrorIdx].style.backgroundColor = color;
            }
        }

        window.onmouseup = () => isDrawing = false;
        document.getElementById('clear').onclick = () => Array.from(grid.children).forEach(c => c.style.backgroundColor = '#000');
        document.getElementById('eraser').onclick = () => currentColor = 'eraser';
    </script>
</body>
</html>
