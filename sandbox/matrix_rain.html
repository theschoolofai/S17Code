<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matrix Digital Rain</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    
    const config = { speed: 0.1, density: 5000, glow: 1.0 };
    const gui = new lil.GUI();
    gui.add(config, 'speed', 0.01, 0.5);
    gui.add(config, 'density', 1000, 20000, 100);
    gui.add(config, 'glow', 0.1, 2.0);

    const particles = new THREE.BufferGeometry();
    const positions = new Float32Array(20000 * 3);
    const velocities = new Float32Array(20000);

    function initParticles() {
        for (let i = 0; i < 20000; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 40;
            positions[i * 3 + 1] = Math.random() * 40;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
            velocities[i] = Math.random() * 0.2 + 0.05;
        }
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    }
    initParticles();

    const material = new THREE.PointsMaterial({ color: 0x00ff00, size: 0.1, transparent: true });
    const rain = new THREE.Points(particles, material);
    scene.add(rain);

    function animate() {
        requestAnimationFrame(animate);
        const pos = particles.attributes.position.array;
        for (let i = 0; i < 20000; i++) {
            if (i < config.density) {
                pos[i * 3 + 1] -= velocities[i] * config.speed * 10;
                if (pos[i * 3 + 1] < -20) pos[i * 3 + 1] = 20;
            }
        }
        particles.attributes.position.needsUpdate = true;
        material.opacity = config.glow;
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
