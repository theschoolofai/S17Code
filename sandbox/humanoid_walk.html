<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humanoid Walk Visualizer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const config = { speed: 0.05, showHighlights: true };
    const gui = new lil.GUI();
    gui.add(config, 'speed', 0, 0.2);
    gui.add(config, 'showHighlights');

    const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    scene.add(gridHelper);

    const robot = new THREE.Group();
    scene.add(robot);

    const metalMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
    const neonMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

    function createLimb(parent, length, color) {
        const group = new THREE.Group();
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, length), metalMat);
        mesh.position.y = -length / 2;
        group.add(mesh);
        if (config.showHighlights) {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.05, 8, 16), neonMat);
            group.add(ring);
        }
        parent.add(group);
        group.position.y = -length;
        return group;
    }

    const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), metalMat);
    robot.add(torso);

    const leftHip = new THREE.Group(); leftHip.position.set(-0.3, -0.75, 0); robot.add(leftHip);
    const leftThigh = createLimb(leftHip, 1.5);
    const leftKnee = createLimb(leftThigh, 1.5);

    const rightHip = new THREE.Group(); rightHip.position.set(0.3, -0.75, 0); robot.add(rightHip);
    const rightThigh = createLimb(rightHip, 1.5);
    const rightKnee = createLimb(rightThigh, 1.5);

    const leftShoulder = new THREE.Group(); leftShoulder.position.set(-0.6, 0.5, 0); robot.add(leftShoulder);
    const leftArm = createLimb(leftShoulder, 1.2);

    const rightShoulder = new THREE.Group(); rightShoulder.position.set(0.6, 0.5, 0); robot.add(rightShoulder);
    const rightArm = createLimb(rightShoulder, 1.2);

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += config.speed;

        leftHip.rotation.x = Math.sin(time) * 0.45;
        rightHip.rotation.x = -Math.sin(time) * 0.45;
        leftKnee.rotation.x = Math.max(0, Math.sin(time) * 0.8);
        rightKnee.rotation.x = Math.max(0, -Math.sin(time) * 0.8);

        leftShoulder.rotation.x = -Math.sin(time) * 0.35;
        rightShoulder.rotation.x = Math.sin(time) * 0.35;
        torso.position.y = 2 + Math.sin(time * 2) * 0.15;

        gridHelper.position.z = (time * 2) % 2;
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
