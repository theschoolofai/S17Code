<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dual Cylinder Engine Simulation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const config = { speed: 0.05, cyl1Visible: true, cyl2Visible: true, flashColor: '#ff4500' };
    const gui = new lil.GUI();
    gui.add(config, 'speed', 0, 0.2);
    gui.add(config, 'cyl1Visible');
    gui.add(config, 'cyl2Visible');
    gui.addColor(config, 'flashColor');

    const metalMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.1 });
    
    // Crankshaft
    const crank = new THREE.Group();
    scene.add(crank);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4), metalMat);
    shaft.rotation.z = Math.PI / 2;
    crank.add(shaft);

    const createPistonAssembly = (xOffset, phase) => {
        const group = new THREE.Group();
        const piston = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.5), metalMat);
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2), metalMat);
        rod.position.y = -1.25;
        group.add(piston, rod);
        group.position.x = xOffset;
        
        const light = new THREE.PointLight(config.flashColor, 0, 5);
        light.position.set(xOffset, 2, 0);
        scene.add(light);
        return { group, light, phase };
    };

    const p1 = createPistonAssembly(-1.5, 0);
    const p2 = createPistonAssembly(1.5, Math.PI);
    scene.add(p1.group, p2.group);

    function animate(time) {
        requestAnimationFrame(animate);
        const angle = time * config.speed;
        crank.rotation.x = angle;

        [p1, p2].forEach(p => {
            const y = Math.sin(angle + p.phase) * 1.5;
            p.group.position.y = y;
            p.group.visible = (p === p1) ? config.cyl1Visible : config.cyl2Visible;
            
            // Flash at TDC (sin = 1)
            const isTDC = Math.sin(angle + p.phase) > 0.95;
            p.light.intensity = isTDC ? 10 : 0;
            p.light.color.set(config.flashColor);
        });

        controls.update();
        renderer.render(scene, camera);
    }
    animate(0);
</script>
</body>
</html>
