<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Planet System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A 3D rotating wireframe planet with orbiting moons.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Planet
    const planetGeo = new THREE.IcosahedronGeometry(2, 2);
    const planetMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
    const planet = new THREE.Mesh(planetGeo, planetMat);
    scene.add(planet);

    // Moon
    const moonGeo = new THREE.SphereGeometry(0.5, 8, 8);
    const moonMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const moon = new THREE.Mesh(moonGeo, moonMat);
    const moonOrbit = new THREE.Object3D();
    scene.add(moonOrbit);
    moonOrbit.add(moon);
    moon.position.x = 4;

    function animate() {
        requestAnimationFrame(animate);
        planet.rotation.y += 0.005;
        moonOrbit.rotation.y += 0.02;
        moon.rotation.x += 0.01;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
