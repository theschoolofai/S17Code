<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Black Hole Gravity Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 20);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const blackHole = new THREE.Mesh(new THREE.SphereGeometry(2, 64, 64), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    scene.add(blackHole);

    const count = 3000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const angles = new Float32Array(count);
    const radii = new Float32Array(count);
    for (let i = 0; i < count; i++) {
        radii[i] = 3 + Math.random() * 10;
        angles[i] = Math.random() * Math.PI * 2;
        positions[i*3] = Math.cos(angles[i]) * radii[i];
        positions[i*3+1] = (Math.random() - 0.5) * 0.2;
        positions[i*3+2] = Math.sin(angles[i]) * radii[i];
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const pMat = new THREE.PointsMaterial({ size: 0.08, color: 0xffaa00, transparent: true, opacity: 0.8 });
    const pSystem = new THREE.Points(geometry, pMat);
    scene.add(pSystem);

    const probes = [];
    for(let i=0; i<5; i++) {
        const probe = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x00ffff }));
        probe.position.set(10 + i*2, 0, 0);
        scene.add(probe);
        probes.push({ mesh: probe, angle: i * Math.PI * 0.4, dist: 10 + i*2 });
    }

    const config = { gravity: 0.02, speed: 0.05 };
    const gui = new lil.GUI();
    gui.add(config, 'gravity', 0, 0.1);
    gui.add(config, 'speed', 0, 0.2);

    function animate() {
        requestAnimationFrame(animate);
        const pos = pSystem.geometry.attributes.position.array;
        for (let i = 0; i < count; i++) {
            angles[i] += config.speed * 0.05;
            radii[i] = Math.max(2.1, radii[i] - config.gravity * 0.5);
            pos[i*3] = Math.cos(angles[i]) * radii[i];
            pos[i*3+2] = Math.sin(angles[i]) * radii[i];
        }
        pSystem.geometry.attributes.position.needsUpdate = true;
        probes.forEach(p => {
            p.dist = Math.max(2.5, p.dist - config.gravity * 0.2);
            p.angle += config.speed * 0.1;
            p.mesh.position.set(Math.cos(p.angle) * p.dist, 0, Math.sin(p.angle) * p.dist);
        });
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
