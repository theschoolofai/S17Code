<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solar System Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 40);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    
    const sun = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    const planets = [];
    const planetData = [
        { size: 0.5, dist: 7, color: 0xaaaaaa, speed: 0.04 },
        { size: 0.8, dist: 10, color: 0xccaa88, speed: 0.035 },
        { size: 0.9, dist: 13, color: 0x4488ff, speed: 0.03 },
        { size: 0.7, dist: 16, color: 0xff4422, speed: 0.025 },
        { size: 2.0, dist: 22, color: 0xffaa66, speed: 0.015 },
        { size: 1.7, dist: 27, color: 0xeecc99, speed: 0.012 },
        { size: 1.2, dist: 32, color: 0x88ccff, speed: 0.009 },
        { size: 1.1, dist: 36, color: 0x4444ff, speed: 0.007 },
        { size: 0.4, dist: 40, color: 0xcccccc, speed: 0.005 }
    ];

    planetData.forEach(data => {
        const orbit = new THREE.Group();
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(data.size, 16, 16), new THREE.MeshPhongMaterial({ color: data.color }));
        mesh.position.x = data.dist;
        orbit.add(mesh);
        scene.add(orbit);
        planets.push({ orbit, speed: data.speed });
    });

    scene.add(new THREE.AmbientLight(0x333333));
    const light = new THREE.PointLight(0xffffff, 2, 100);
    scene.add(light);

    function animate() {
        requestAnimationFrame(animate);
        planets.forEach(p => p.orbit.rotation.y += p.speed);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
