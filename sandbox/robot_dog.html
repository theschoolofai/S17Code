<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Robot Dog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #05050a; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    scene.add(grid);

    const dog = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 1), new THREE.MeshStandardMaterial({ color: 0x888888 }));
    dog.add(body);

    const legs = [];
    const legPositions = [[0.8, -0.4, 0.4], [0.8, -0.4, -0.4], [-0.8, -0.4, 0.4], [-0.8, -0.4, -0.4]];
    legPositions.forEach((pos, i) => {
        const leg = new THREE.Group();
        leg.position.set(...pos);
        const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
        upper.position.y = -0.3;
        leg.add(upper);
        const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6), new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
        lower.position.y = -0.9;
        leg.add(lower);
        dog.add(leg);
        legs.push({ group: leg, upper, lower, offset: i * Math.PI / 2 });
    });
    scene.add(dog);

    const config = { speed: 0.05 };
    const gui = new lil.GUI();
    gui.add(config, 'speed', 0, 0.2);

    function animate(time) {
        requestAnimationFrame(animate);
        legs.forEach((leg, i) => {
            const angle = Math.sin(time * 0.01 * config.speed * 20 + leg.offset) * 0.5;
            leg.group.rotation.z = angle;
        });
        controls.update();
        renderer.render(scene, camera);
    }
    animate(0);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
